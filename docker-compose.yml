services:
  database:
    image: postgres:14.5
    restart: on-failure
    container_name: travel-app.database
    environment:
        - POSTGRES_USER=postgres
        - POSTGRES_PASSWORD=postgres
        - POSTGRES_DB=travelapp
    logging:
        options:
            max-size: 10m
            max-file: "3"
    ports:
        - '5432:5432'
    volumes:
        - "postgres-data:/var/lib/postgresql/data"

volumes:
  postgres-data: