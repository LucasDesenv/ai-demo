server:
  port: 8080

spring:
  profiles:
    active: integration-test
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:5432/travelapp
    driver-class-name: org.postgresql.Driver
    username: postgres
    password: postgres
    type: com.zaxxer.hikari.HikariDataSource
    hikari:
      pool-name: HikariPool
      connection-timeout: 20000
      minimum-idle: 5
      maximum-pool-size: 50
      idle-timeout: 300000
      max-lifetime: 1200000
      auto-commit: false
  jpa:
    properties.hibernate:
      use_sql: true
      hibernate.dialect: true
      id.new_generator_mappings: false
      search.autoregister_listeners: false
      bytecode.use_reflection_optimizer: false
      enable_lazy_load_no_trans: true
      event:
        merge:
          entity_copy_observer: allow
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    defer-datasource-initialization: false
    hibernate:
      connection.provider_class: org.hibernate.hikaricp.internal.HikariCPConnectionProvider
      ddl-auto: none
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
logging:
  level:
    com:
      ai:
        demo: DEBUG
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    display-request-duration: true
imf:
  dataservice.ifs.base.url: http://localhost
  scheduler:
    cron: "0 0 0 1 * ?" #first day of the month
redis:
  port: 8083
  host: localhost
openai:
  api:
    key: blabla